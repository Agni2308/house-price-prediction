[project]
name = "house-price-prediction"
version = "1.0.0"
description = "Linear Regression vs Random Forest for Bengaluru house price prediction, with a Flask API and web pages."
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[tool.vercel]
entrypoint = "api.index:app"
